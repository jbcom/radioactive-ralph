# Baked into the radioactive-ralph WSL2 distro's rootfs at /etc/wsl.conf.
# See docs/superpowers/specs/2026-08-20-windows-wsl2-dispatch-design.md.

[boot]
# Enables systemd as PID 1 -- the officially supported way to run a proper
# init system under WSL2. The Dockerfile masks the specific units Microsoft
# documents as conflicting with WSL2's own networking/tmpfs handling.
systemd=true

[interop]
# Left explicit rather than relying on the (already-true) default: this is
# load-bearing for invoking the Windows-side, already-authenticated
# claude/codex/copilot binaries from inside this distro instead of requiring
# a separate Linux-side install + re-authentication (see the design doc's
# "Windows-side authentication carries over via WSL interop" section).
enabled=true
appendWindowsPath=true

[automount]
# WSL2 default; explicit so a future WSL default change doesn't silently
# affect whether this distro can reach Windows-side binaries via /mnt/c.
enabled=true
