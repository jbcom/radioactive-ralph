# GoReleaser config for radioactive-ralph
# https://goreleaser.com/customization/

version: 2

project_name: radioactive_ralph

before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  - id: radioactive_ralph
    main: ./cmd/radioactive_ralph
    binary: radioactive_ralph
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.ShortCommit}}
      - -X main.Date={{.Date}}
    flags:
      - -trimpath

archives:
  - id: default
    ids: [radioactive_ralph]
    name_template: >-
      radioactive_ralph_{{ .Version }}_
      {{- if eq .Os "darwin" }}darwin_{{ .Arch }}
      {{- else if eq .Os "linux" }}linux_{{ .Arch }}
      {{- else if eq .Os "windows" }}windows_{{ .Arch }}
      {{- end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

# Native Linux packages (.deb / .rpm) for the CLI. CGO-off like the archives,
# so they build in the same ubuntu goreleaser run and are cosign-signed via the
# checksums entry below. The GUI app is packaged separately per-OS (fyne
# package) — see the packaging design spec.
nfpms:
  - id: radioactive_ralph
    ids: [radioactive_ralph]
    package_name: radioactive-ralph
    vendor: Jon Bogaty
    homepage: https://github.com/jbcom/radioactive-ralph
    maintainer: jbcom-bot <noreply@jonbogaty.com>
    description: Supervised-execution runtime for local AI-agent CLIs
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    # Only the CLI binary is packaged; the per-user supervisor registers itself
    # with the OS service manager via `radioactive_ralph service install`, so
    # there is no system-wide unit file to ship here.
    contents:
      - src: LICENSE
        dst: /usr/share/doc/radioactive-ralph/LICENSE
      - src: README.md
        dst: /usr/share/doc/radioactive-ralph/README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

# Single cross-packager repo at jbcom/pkgs holds Casks/, bucket/, choco/, nix/,
# etc. Users tap with
# `brew tap jbcom/pkgs https://github.com/jbcom/pkgs` (the explicit URL form is
# required because the repo isn't named homebrew-pkgs).
#
# goreleaser v2.17 removed the `brews` (formula) generator in favour of
# `homebrew_casks`. Modern Homebrew casks carry CLI binaries via the `binary`
# stanza, so the CLI ships as a binary cask
# (`brew install --cask radioactive-ralph`). The desktop app uses the distinct
# `radioactive-ralph-gui` cask token; sharing this token would make the two
# publishers race to overwrite the same file in jbcom/pkgs.
homebrew_casks:
  - name: radioactive-ralph
    ids: [default]
    skip_upload: true
    repository:
      owner: jbcom
      name: pkgs
      branch: "chore/update-radioactive-ralph-{{ .Version }}"
      token: "{{ .Env.JBCOM_PKGS_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: jbcom
          name: pkgs
          branch: main
    directory: Casks
    homepage: https://github.com/jbcom/radioactive-ralph
    description: Supervised-execution runtime for local AI-agent CLIs
    binaries:
      - radioactive_ralph
    commit_author:
      name: jbcom-bot
      email: noreply@jonbogaty.com
    caveats: |
      Next step — start the supervisor, then register a project:

        radioactive_ralph service install
        radioactive_ralph --init

      Run `radioactive_ralph` inside a registered project for the
      read-only TUI once the supervisor is running. Full docs:

        https://jonbogaty.com/radioactive-ralph/getting-started/

scoops:
  - name: radioactive-ralph
    ids: [default]
    skip_upload: true
    repository:
      owner: jbcom
      name: pkgs
      branch: "chore/update-radioactive-ralph-{{ .Version }}"
      token: "{{ .Env.JBCOM_PKGS_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: jbcom
          name: pkgs
          branch: main
    directory: bucket
    homepage: https://github.com/jbcom/radioactive-ralph
    description: Native Windows foreground supervisor/client control plane only
    license: MIT
    post_install:
      - "Write-Host 'Native Windows provides only the foreground supervisor/client control plane:'"
      - "Write-Host '  radioactive_ralph --supervisor'"
      - "Write-Host 'Native Windows SCM install/start and provider-backed workers are disabled.'"
      - "Write-Host 'For provider-backed execution, install the Linux build inside WSL2 and use systemd --user.'"
      - "Write-Host 'See https://jonbogaty.com/radioactive-ralph/getting-started/ for the full platform-specific setup flow.'"

# winget manifests (Windows Package Manager) are generated under dist only.
# Upload is deliberately disabled: there is no tested staging or submission
# path, so winget is not part of the supported public install surface.
winget:
  - name: radioactive-ralph
    ids: [default]
    skip_upload: true
    publisher: jbcom
    publisher_url: https://github.com/jbcom
    package_identifier: jbcom.radioactive-ralph
    homepage: https://github.com/jbcom/radioactive-ralph
    short_description: Native Windows foreground supervisor/client control plane only
    description: |
      This native Windows package provides only Radioactive Ralph's foreground
      supervisor/client control plane through radioactive_ralph --supervisor.
      Native Windows SCM install/start and provider-backed workers are disabled.
      Use the Linux build inside WSL2 with systemd --user for functional Claude,
      Codex, and OpenCode worker execution.
    license: MIT
    license_url: https://github.com/jbcom/radioactive-ralph/blob/main/LICENSE
    release_notes_url: https://github.com/jbcom/radioactive-ralph/releases/tag/v{{ .Version }}
    repository:
      owner: jbcom
      name: pkgs
      branch: "chore/update-radioactive-ralph-winget-{{ .Version }}"
      token: "{{ .Env.JBCOM_PKGS_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: jbcom
          name: pkgs
          branch: main
    path: winget

# Chocolatey publishing is split into .goreleaser.chocolatey.yaml and
# runs from a windows-latest job in release.yml, since `choco.exe`
# is only available on Windows runners.

release:
  github:
    owner: jbcom
    name: radioactive-ralph
  # Release Please creates the tagged draft; every release job adds its
  # artifacts to that draft. release.yml publishes it only after the required
  # CLI, GUI, and package-manager jobs have all succeeded.
  draft: true
  use_existing_draft: true
  replace_existing_artifacts: true
  prerelease: auto
  name_template: "v{{ .Version }}"
  footer: |
    ## Install

    Homebrew cask (macOS):
    ```
    brew tap jbcom/pkgs https://github.com/jbcom/pkgs
    brew install --cask radioactive-ralph
    ```

    Scoop (Windows):
    ```
    scoop bucket add jbcom https://github.com/jbcom/pkgs
    scoop install radioactive-ralph
    ```

    curl | sh:
    ```
    curl -sSL https://jonbogaty.com/radioactive-ralph/install.sh | sh
    ```

    First run (macOS, Linux, or the Linux build inside WSL2):
    ```
    radioactive_ralph service install
    radioactive_ralph --init
    radioactive_ralph
    ```

    Native Windows provides only the foreground supervisor/client control
    plane:
    ```
    radioactive_ralph --supervisor
    ```
    Native Windows SCM install/start and provider-backed workers are disabled.
    Use the Linux build inside WSL2 for functional provider-backed execution.
