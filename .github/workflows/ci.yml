name: CI

on:
  # PRs and the merge queue ONLY. There is deliberately no push trigger.
  #
  # `push: branches: [main]` re-ran the entire 23-job matrix on every merge, and
  # with a merge queue that verifies nothing: the queued commit IS main's future
  # state, GitHub already ran these checks against it, and merging is what
  # happens *because* they passed. It was a second full matrix per merge —
  # including four macOS jobs on a two-wide pool — testing a tree that had just
  # been tested.
  #
  # What ships from main is release.yml and cd.yml's job, and release.yml runs
  # GoReleaser, which rebuilds and smoke-tests every platform target anyway.
  pull_request:
    types: [opened, synchronize, reopened]
  # Required for a merge queue: GitHub runs the required checks against the
  # queued merge commit (base + this PR + everything ahead of it) and merges
  # only if they pass. Without this trigger the queue has nothing to wait for.
  #
  # This is what makes `strict` affordable. Strict protection means every merge
  # invalidates every other PR, so each one must rebase and re-run the whole
  # 23-job matrix — ~14 minutes, serialized, against a macOS pool that runs two
  # jobs at a time. Ten PRs cost hours of pure waiting. The queue tests the
  # SAME combined result once, in order, instead of making every author rebase
  # into a moving target.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# One in-flight run per PR. Every push previously started a full run — four
# macOS jobs among them — while every superseded run kept its queued slots, so
# a branch pushed eight times held thirty-two macOS jobs for work already
# obsolete.
#
# A merge_group run keys on github.run_id, which is unique, so a queued merge
# is NEVER cancelled by this: cancelling one would drop a merge GitHub is
# actively gating on. main is excluded for the same reason — its runs gate
# releases.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Setup Bun for generated OpenCode adapter smoke
        if: runner.os != 'Windows'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.220
      - name: go mod download
        # Retry: a transient proxy.golang.org / sum.golang.org failure is not a
        # build failure. Both were observed on the same afternoon, on PRs that
        # changed only a test fake and only a markdown file:
        #   read "https://proxy.golang.org/...zip": stream error; INTERNAL_ERROR
        #   verifying module: reading https://sum.golang.org/tile/...: stream error
        # A bare `go mod download` turns either into a red check on a diff that
        # cannot have caused it. Bounded at 3 attempts so a REAL resolution
        # failure (a bad go.mod, a deleted module) still fails, just later.
        # shell: bash is REQUIRED, not stylistic. The test matrix includes a
        # windows-latest leg, where GitHub defaults to pwsh -- which cannot
        # parse a POSIX `for ...; do` loop, so the required Windows check
        # would fail before running a single test. Set on all four for
        # consistency; bash is present on every GitHub-hosted runner.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "go mod download failed (attempt $attempt/3)" >&2
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 10))
          done
      - name: go test (Unix)
        if: runner.os != 'Windows'
        # -timeout explicitly, NOT the 10-minute default. Under -race the
        # provider package's endless-output tests each budget 300s (they push
        # 16 MiB through a pty and the detector costs ~19x), and the package
        # clock covers the whole BINARY, not each test. Relying on the default
        # made a per-test budget unspendable: 3 x 300s + ~190s for the rest of
        # the package is ~1090s, so the binary would have panicked at 600s
        # before a test could use the time it was given.
        # Keep this in step with endlessOutputBudget in
        # internal/provider/race_budget_race_test.go -- the two numbers are one
        # decision split across two files, and only their SUM is meaningful.
        run: go test -race -timeout 20m -coverprofile=coverage.out -covermode=atomic ./...
      - name: Enforcement adapter mutation proofs
        if: runner.os == 'Linux'
        run: bash scripts/ci/test_enforcement_adapter_mutations.sh
      - name: go test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: go test ./...
      - name: Build CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          bin="$(pwd)/.tmp/radioactive_ralph"
          go build -o "$bin" ./cmd/radioactive_ralph
          echo "RALPH_BIN=$bin" >> "$GITHUB_ENV"
      - name: Native CLI smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          "$RALPH_BIN" --help >/dev/null
          "$RALPH_BIN" service --help >/dev/null
          "$RALPH_BIN" service install --help >/dev/null
          "$RALPH_BIN" service status --help >/dev/null
          "$RALPH_BIN" service uninstall --help >/dev/null
          "$RALPH_BIN" doctor
      - name: Temp project + supervisor + service-definition smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          project="$tmpdir/project"
          home="$tmpdir/home"
          state="$tmpdir/state"
          log="$tmpdir/supervisor.log"
          mkdir -p "$project" "$home" "$state"
          export HOME="$home"
          export RALPH_STATE_DIR="$state"

          # A plain client run against an uninitialized, supervisor-less
          # directory auto-routes to init (spec §4) and then fails
          # cleanly with no supervisor listening yet.
          if (cd "$project" && "$RALPH_BIN") >/dev/null 2>&1; then
            echo "expected the plain client to fail before any supervisor is running" >&2
            exit 1
          fi

          # Start the durable supervisor BEFORE --init.
          #
          # init now resolves the project THROUGH the supervisor rather than
          # opening the store itself (the dumb-client boundary), so it needs
          # one listening. This ordering used to be the other way around and
          # only worked because init was a store writer — the very thing that
          # boundary exists to stop.
          "$RALPH_BIN" --supervisor >"$log" 2>&1 &
          sup_pid=$!
          cleanup() {
            if kill -0 "$sup_pid" >/dev/null 2>&1; then
              kill "$sup_pid" >/dev/null 2>&1 || true
              wait "$sup_pid" || true
            fi
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 30); do
            if (cd "$project" && "$RALPH_BIN") 2>/dev/null | grep -q "captured_at="; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" -ne 1 ]]; then
            cat "$log" >&2 || true
            echo "supervisor never became ready" >&2
            exit 1
          fi

          # --init explicitly, now that a supervisor is listening to serve it.
          (cd "$project" && "$RALPH_BIN" --init >/dev/null)

          kill "$sup_pid"
          wait "$sup_pid" || true
          trap - EXIT

          stopped=0
          for _ in $(seq 1 30); do
            if ! (cd "$project" && "$RALPH_BIN") 2>/dev/null | grep -q "captured_at="; then
              stopped=1
              break
            fi
            sleep 1
          done
          if [[ "$stopped" -ne 1 ]]; then
            cat "$log" >&2 || true
            echo "supervisor never stopped" >&2
            exit 1
          fi

          # Live service-manager lifecycle proof belongs to the dedicated
          # service-managers workflow. Unit/render coverage in this matrix
          # must not mutate a runner's real user service manager.
      - name: Build CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .tmp | Out-Null
          $bin = Join-Path (Get-Location) ".tmp\\radioactive_ralph.exe"
          go build -o $bin ./cmd/radioactive_ralph
          "RALPH_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Native CLI smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Invoke-NativeChecked {
            param(
              [Parameter(Mandatory = $true)][string]$FilePath,
              [Parameter(Mandatory = $true)][string[]]$ArgumentList,
              [switch]$SuppressOutput
            )
            if ($SuppressOutput) {
              & $FilePath @ArgumentList | Out-Null
            } else {
              & $FilePath @ArgumentList
            }
            if ($LASTEXITCODE -ne 0) {
              throw "$FilePath $($ArgumentList -join ' ') failed with exit code $LASTEXITCODE"
            }
          }
          Invoke-NativeChecked -FilePath $env:RALPH_BIN -ArgumentList @("--help") -SuppressOutput
          Invoke-NativeChecked -FilePath $env:RALPH_BIN -ArgumentList @("service", "--help") -SuppressOutput
          Invoke-NativeChecked -FilePath $env:RALPH_BIN -ArgumentList @("service", "install", "--help") -SuppressOutput
          Invoke-NativeChecked -FilePath $env:RALPH_BIN -ArgumentList @("service", "status", "--help") -SuppressOutput
          Invoke-NativeChecked -FilePath $env:RALPH_BIN -ArgumentList @("service", "uninstall", "--help") -SuppressOutput
          Invoke-NativeChecked -FilePath $env:RALPH_BIN -ArgumentList @("doctor")
      - name: Temp project + supervisor smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Invoke-QuietNative {
            param(
              [Parameter(Mandatory = $true)][string]$FilePath,
              # NOT Mandatory and defaulted to @(): the bare-client smoke case
              # invokes radioactive_ralph with NO args, and a Mandatory
              # [string[]] parameter rejects an empty array outright.
              [string[]]$ArgumentList = @()
            )
            $token = [guid]::NewGuid().ToString()
            $stdout = Join-Path $env:RUNNER_TEMP "$token.stdout.log"
            $stderr = Join-Path $env:RUNNER_TEMP "$token.stderr.log"
            try {
              # Start-Process -ArgumentList also rejects an empty array, so
              # only pass it when there are actually args to forward.
              $startArgs = @{
                FilePath               = $FilePath
                RedirectStandardOutput = $stdout
                RedirectStandardError  = $stderr
                PassThru               = $true
                Wait                   = $true
                NoNewWindow            = $true
              }
              if ($ArgumentList.Count -gt 0) { $startArgs.ArgumentList = $ArgumentList }
              $proc = Start-Process @startArgs
              return $proc.ExitCode
            } finally {
              Remove-Item $stdout, $stderr -ErrorAction SilentlyContinue
            }
          }
          $tmp = Join-Path $env:RUNNER_TEMP "ralph-smoke"
          $project = Join-Path $tmp "project"
          # NB: $HOME is a read-only PowerShell automatic variable — assigning
          # to it throws WriteError, so use $homeDir for the isolated home.
          $homeDir = Join-Path $tmp "home"
          $state = Join-Path $tmp "state"
          New-Item -ItemType Directory -Force -Path $project, $homeDir, $state | Out-Null
          $env:HOME = $homeDir
          $env:RALPH_STATE_DIR = $state

          # No --init here: init now resolves the project THROUGH the
          # supervisor (the dumb-client boundary), so it needs one listening.
          # This block exists to prove the plain client FAILS without a
          # supervisor, which is exactly the state it is testing.
          Push-Location $project
          try {
            $clientExit = Invoke-QuietNative -FilePath $env:RALPH_BIN -ArgumentList @()
            if ($clientExit -eq 0) { throw "expected the plain client to fail before any supervisor is running" }
          } finally {
            Pop-Location
          }

          $supStdout = Join-Path $tmp "supervisor.stdout.log"
          $supStderr = Join-Path $tmp "supervisor.stderr.log"
          $proc = Start-Process -FilePath $env:RALPH_BIN -ArgumentList @("--supervisor") -RedirectStandardOutput $supStdout -RedirectStandardError $supStderr -PassThru

          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            Push-Location $project
            try {
              $out = & $env:RALPH_BIN 2>$null
              if (($out -join "`n") -match "captured_at=") {
                $ready = $true
                break
              }
            } catch {
            } finally {
              Pop-Location
            }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) {
            if (Test-Path $supStdout) { Get-Content $supStdout }
            if (Test-Path $supStderr) { Get-Content $supStderr }
            throw "supervisor never became ready"
          }

          # --init explicitly, now that a supervisor is listening to serve it.
          Push-Location $project
          try { & $env:RALPH_BIN --init | Out-Null } finally { Pop-Location }

          Stop-Process -Id $proc.Id -Force
          $deadline = (Get-Date).AddSeconds(30)
          while (-not $proc.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 200
          }
          if (-not $proc.HasExited) {
            throw "supervisor did not exit within 30s"
          }

          Push-Location $project
          try {
            $clientExit = Invoke-QuietNative -FilePath $env:RALPH_BIN -ArgumentList @()
            if ($clientExit -eq 0) { throw "expected the plain client to fail after the supervisor stopped" }
          } finally {
            Pop-Location
          }

          # Native SCM lifecycle requires a dedicated elevated Windows
          # service-manager job. This unprivileged matrix proves the
          # foreground supervisor/client runtime and unit-level service code.
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out

  e2e:
    name: E2E (CI-feasible)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go mod download
        # Retry: a transient proxy.golang.org / sum.golang.org failure is not a
        # build failure. Both were observed on the same afternoon, on PRs that
        # changed only a test fake and only a markdown file:
        #   read "https://proxy.golang.org/...zip": stream error; INTERNAL_ERROR
        #   verifying module: reading https://sum.golang.org/tile/...: stream error
        # A bare `go mod download` turns either into a red check on a diff that
        # cannot have caused it. Bounded at 3 attempts so a REAL resolution
        # failure (a bad go.mod, a deleted module) still fails, just later.
        # shell: bash is REQUIRED, not stylistic. The test matrix includes a
        # windows-latest leg, where GitHub defaults to pwsh -- which cannot
        # parse a POSIX `for ...; do` loop, so the required Windows check
        # would fail before running a single test. Set on all four for
        # consistency; bash is present on every GitHub-hosted runner.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "go mod download failed (attempt $attempt/3)" >&2
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 10))
          done
      - name: Materialize the reference test-repo fixture
        run: |
          set -euo pipefail
          mkdir -p "$HOME/src/reference-codebases"
          fixture="$HOME/src/reference-codebases/test-repo"
          git init -q "$fixture"
          git -C "$fixture" remote add origin https://github.com/zpqrtbnk/test-repo
          git -C "$fixture" fetch --depth 1 origin \
            4b6d6bcb4819be4fe209e807726e83be12da3190
          git -C "$fixture" checkout -q --detach FETCH_HEAD
      - name: E2E (real binary, pty-driven, fake provider CLI — no RALPH_E2E_LIVE)
        run: go test ./tests/e2e/... -v -timeout 5m

  gui:
    name: GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Bun for generated OpenCode adapter smoke
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      # Fyne is a CGO GUI dependency. On Linux it needs the GL + X11 dev headers
      # to link even against the headless test driver; macOS links Cocoa via the
      # toolchain. The rest of CI builds CGO-off and excludes the `gui`-tagged
      # package entirely — this job is the only place it is compiled.
      - name: Install Linux GL/X11/Wayland dev headers
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # Fyne's documented Linux build deps: GL + X11 (xorg-dev) AND the
          # Wayland stack — glfw 3.4 compiles its Wayland backend unconditionally,
          # so wayland-client-core.h (libwayland-dev) + wayland-protocols +
          # libxkbcommon are all required even for a headless test-driver build.
          sudo apt-get install -y \
            libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols
      - name: Generate the en_US.UTF-8 locale
        if: matrix.os == 'ubuntu-latest'
        # The GUI test sets LANG/LC_ALL=en-US so Fyne's BCP-47 locale parse is
        # well-formed, but the underlying OS locale must ALSO exist — otherwise
        # setlocale silently fails ("cannot change locale (en-US)"), the shaper
        # falls back to the undefined tag, and go-text/typesetting's harfbuzz
        # panics (index out of range in applyGPOSPair2). GitHub's ubuntu runners
        # don't ship a generated en_US locale, so generate it here.
        run: |
          sudo apt-get install -y locales
          sudo locale-gen en_US.UTF-8
          sudo update-locale
      - name: go mod download
        # Retry: a transient proxy.golang.org / sum.golang.org failure is not a
        # build failure. Both were observed on the same afternoon, on PRs that
        # changed only a test fake and only a markdown file:
        #   read "https://proxy.golang.org/...zip": stream error; INTERNAL_ERROR
        #   verifying module: reading https://sum.golang.org/tile/...: stream error
        # A bare `go mod download` turns either into a red check on a diff that
        # cannot have caused it. Bounded at 3 attempts so a REAL resolution
        # failure (a bad go.mod, a deleted module) still fails, just later.
        # shell: bash is REQUIRED, not stylistic. The test matrix includes a
        # windows-latest leg, where GitHub defaults to pwsh -- which cannot
        # parse a POSIX `for ...; do` loop, so the required Windows check
        # would fail before running a single test. Set on all four for
        # consistency; bash is present on every GitHub-hosted runner.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "go mod download failed (attempt $attempt/3)" >&2
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 10))
          done
      - name: Build GUI-enabled binary
        env:
          CGO_ENABLED: '1'
        run: go build -tags gui ./...
      - name: Install a shaper-safe font for the headless GUI test
        if: matrix.os == 'ubuntu-latest'
        # Fyne's bundled default font trips a crash inside go-text/typesetting@0.3.4's
        # pure-Go harfbuzz shaper on Linux (index-out-of-range in otShapeNormalize/
        # applyGPOSPair2) during the headless render — a bug in the pinned shaper,
        # NOT in our code (the test passes on macOS, which uses CoreText). Point
        # FYNE_FONT at DejaVu Sans, which that shaper processes without crashing.
        run: sudo apt-get install -y fonts-dejavu-core
      - name: Test GUI-enabled repository (headless test driver)
        env:
          CGO_ENABLED: '1'
          # A well-formed locale so Fyne's BCP-47 parse is valid (the OS locale is
          # generated in the step above).
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          # Use a font the go-text harfbuzz shaper handles cleanly (see the
          # install step's comment) instead of Fyne's bundled default, which
          # panics that shaper on Linux.
          FYNE_FONT: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
        # Run the complete tagged tree, not only internal/gui. The root command
        # owns the non-TTY desktop-dispatch boundary, and its GUI-tagged tests
        # must remain part of the protected regression gate.
        run: go test -tags gui ./... -timeout 5m

  build-targets:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go mod download
        # Retry: a transient proxy.golang.org / sum.golang.org failure is not a
        # build failure. Both were observed on the same afternoon, on PRs that
        # changed only a test fake and only a markdown file:
        #   read "https://proxy.golang.org/...zip": stream error; INTERNAL_ERROR
        #   verifying module: reading https://sum.golang.org/tile/...: stream error
        # A bare `go mod download` turns either into a red check on a diff that
        # cannot have caused it. Bounded at 3 attempts so a REAL resolution
        # failure (a bad go.mod, a deleted module) still fails, just later.
        # shell: bash is REQUIRED, not stylistic. The test matrix includes a
        # windows-latest leg, where GitHub defaults to pwsh -- which cannot
        # parse a POSIX `for ...; do` loop, so the required Windows check
        # would fail before running a single test. Set on all four for
        # consistency; bash is present on every GitHub-hosted runner.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "go mod download failed (attempt $attempt/3)" >&2
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 10))
          done
      - name: Cross-build module
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...
      - name: Cross-build platform-sensitive test binaries
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/testbins
          for pkg in ./cmd/radioactive_ralph ./internal/ipc ./internal/service ./internal/supervisor ./internal/provider/claudesession; do
            name="$(echo "$pkg" | tr '/.' '__')"
            out=".tmp/testbins/${name}"
            if [[ "$GOOS" == "windows" ]]; then
              out="${out}.exe"
            fi
            go test -c -o "$out" "$pkg"
            rm -f "$out"
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install actionlint
        # Retried for the same reason as `go mod download`: this RESOLVES
        # MODULES over the network, so a transient proxy.golang.org failure
        # fails the job. A Package GUI (windows-latest) run failed exactly
        # here, inside `go install`, in a job with no download step to retry.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12; then exit 0; fi
            echo "go install actionlint failed (attempt $attempt/3)" >&2
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 10))
          done
      - name: Lint workflows
        run: actionlint

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Build docs
        run: make docs-check

  package-artifacts:
    name: Package artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --snapshot --clean --skip=publish,sign
      - name: Smoke snapshot archives, native packages, and installer
        run: bash scripts/ci/smoke_goreleaser_artifacts.sh

  package-artifacts-arm64:
    name: Package artifacts (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --snapshot --clean --skip=publish,sign
      - name: Smoke native arm64 archives, packages, and installer
        run: bash scripts/ci/smoke_goreleaser_artifacts.sh

  package-gui:
    name: Package GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            arch: x86_64
          - os: macos-latest
            target: darwin
            arch: arm64
          - os: macos-15-intel
            target: darwin
            arch: amd64
          - os: windows-latest
            target: windows
            arch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Linux GUI dev headers
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols
      - name: Install pinned Fyne CLI
        # Retried for the same reason as `go mod download`: this RESOLVES
        # MODULES over the network, so a transient proxy.golang.org failure
        # fails the job. A Package GUI (windows-latest) run failed exactly
        # here, inside `go install`, in a job with no download step to retry.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go install fyne.io/tools/cmd/fyne@v1.7.2; then exit 0; fi
            echo "go install fyne failed (attempt $attempt/3)" >&2
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 10))
          done
      - name: Build and smoke exact native GUI package
        shell: bash
        run: |
          VERSION="$(jq -er '."."' .release-please-manifest.json)"
          bash scripts/ci/build_gui_package.sh "$VERSION" "${{ matrix.target }}"
          bash scripts/ci/finalize_gui_bundle.sh \
            "$VERSION" "${{ matrix.target }}" "${{ matrix.arch }}"

  packaging:
    name: Packaging lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Validate the goreleaser config (CLI archives, nfpms, brews, scoops,
      # winget) so a config error surfaces on the PR, not at release-tag time.
      - name: Validate primary GoReleaser config
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: check
      - name: Validate Chocolatey GoReleaser config
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: check --config .goreleaser.chocolatey.yaml
      - name: Install shellcheck + desktop-file-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck desktop-file-utils
      - name: Shellcheck coverage (every repo script is on the list)
        run: bash scripts/ci/test_shellcheck_coverage.sh

      # The self-test's tracked-edit guard shipped three separate bugs, each
      # found by exercising it rather than reading it. Shellchecking the script
      # proves it parses, not that the guard fires.
      - name: Self-test tracked-edit guard behaves
        run: bash scripts/ci/test_self_test_tracked_edit_guard.sh

      - name: Shellcheck packaging + install scripts
        run: |
          # -x so sourced files are followed. Without it a `source` of a real,
          # in-repo helper reports SC1091 and the only fixes are a blanket
          # disable or leaving the script off this list entirely.
          shellcheck -x \
            packaging/linux/build-appimage.sh \
            packaging/publish-cli-manifests.sh \
            packaging/macos/push-version-branch.sh \
            packaging/wsl/build-rootfs.sh \
            docs/install.sh \
            scripts/ci/test_install_signature_policy.sh \
            scripts/ci/dmg_stale_devices.sh \
            scripts/ci/test_dmg_stale_devices.sh \
            scripts/ci/finalize_gui_bundle.sh \
            scripts/verify-docs-artifact.sh \
            scripts/verify-repo-claims.sh \
            scripts/self-test.sh \
            scripts/drive-open-prs.sh \
            scripts/record-demo.sh \
            scripts/validate-docs.sh \
            scripts/ci/smoke_launchd.sh \
            scripts/ci/smoke_systemd_user.sh \
            scripts/ci/test_shellcheck_coverage.sh \
            scripts/ci/test_self_test_tracked_edit_guard.sh \
            scripts/ci/test_enforcement_adapter_mutations.sh \
            .claude/hooks/task-batch-flush.sh \
            scripts/ci/wait_for_package_publication.sh \
            scripts/ci/test_wait_for_package_publication.sh \
            scripts/ci/test_publish_cli_manifests.sh \
            scripts/ci/build_gui_package.sh \
            scripts/ci/finalize_gui_bundle.sh \
            scripts/ci/package_guidance_contract.sh \
            scripts/ci/smoke_goreleaser_artifacts.sh \
            scripts/ci/test_smoke_goreleaser_artifacts.sh \
            scripts/ci/test_package_guidance_contract.sh \
            scripts/ci/rollback_package_manifests.sh \
            scripts/ci/test_rollback_package_manifests.sh \
            scripts/ci/rewrite_homebrew_cask_url.sh \
            scripts/ci/test_rewrite_homebrew_cask_url.sh \
            scripts/ci/verify_release_assets.sh \
            scripts/ci/test_verify_release_assets.sh \
            scripts/ci/require_immutable_releases.sh \
            scripts/ci/test_require_immutable_releases.sh \
            scripts/ci/prepare_package_rollback_provenance.sh \
            scripts/ci/test_prepare_package_rollback_provenance.sh \
            scripts/ci/prepare_package_manifests_bundle.sh \
            scripts/ci/test_prepare_package_manifests_bundle.sh \
            scripts/ci/prepare_release_seal.sh \
            scripts/ci/test_push_version_branch.sh
      - name: Test package publication gate
        run: |
          bash scripts/ci/test_wait_for_package_publication.sh
          bash scripts/ci/test_publish_cli_manifests.sh
          bash scripts/ci/test_prepare_package_manifests_bundle.sh
          bash scripts/ci/test_verify_release_assets.sh
          bash scripts/ci/test_require_immutable_releases.sh
          bash scripts/ci/test_rollback_package_manifests.sh
          bash scripts/ci/test_rewrite_homebrew_cask_url.sh
          bash scripts/ci/test_push_version_branch.sh
          bash scripts/ci/test_smoke_goreleaser_artifacts.sh
          bash scripts/ci/test_package_guidance_contract.sh
          bash scripts/ci/test_install_signature_policy.sh
          bash scripts/ci/test_dmg_stale_devices.sh
          bash scripts/ci/test_prepare_package_rollback_provenance.sh
          python3 scripts/ci/test_premerge_scoop_server_contract.py
      - name: Validate the .desktop launcher
        run: desktop-file-validate packaging/linux/radioactive-ralph.desktop

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
