name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      phase:
        description: Prepare and attest, or publish after a successful prepare run
        required: true
        type: choice
        options: [prepare, publish]
      tag:
        description: Exact existing Release Please tag (recovery is limited to v0.22.0)
        required: true
        type: string
      source_commit:
        description: Exact commit currently referenced by the existing tag
        required: true
        type: string
      workflow_commit:
        description: Exact main commit containing this reviewed recovery workflow
        required: true
        type: string
      release_id:
        description: Exact numeric Release Please draft ID
        required: true
        type: string
      prepared_run_id:
        description: Successful prepare run containing signed readiness evidence
        required: true
        default: "0"
        type: string
      immutable_releases_preflight:
        description: JSON evidence emitted by dispatch_release_recovery.sh
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions: {}

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
  RELEASE_WORKFLOW_COMMIT: ${{ inputs.workflow_commit || github.sha }}
  RELEASE_ID: ${{ inputs.release_id }}
  RELEASE_PHASE: ${{ inputs.phase || 'automatic' }}
  PREPARED_RUN_ID: ${{ inputs.prepared_run_id || '0' }}
  RELEASE_CONTROL_REF: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
  RELEASE_BUILD_ROOT: ${{ github.event_name == 'workflow_dispatch' && 'release-source' || '.' }}
  GORELEASER_CONFIG: ${{ github.event_name == 'workflow_dispatch' && '../.goreleaser.yaml' || '.goreleaser.yaml' }}
  RELEASE_IMMUTABLE_PREFLIGHT: ${{ inputs.immutable_releases_preflight }}
  GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release-admission:
    name: Admit exact Release Please handoff
    outputs:
      state: ${{ steps.release_state.outputs.state }}
      release_id: ${{ steps.release_state.outputs.release_id }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_CONTROL_REF }}
      # The PAT is reserved for cross-repository jbcom/pkgs operations.
      # Current-repository release reads and writes use the built-in token.
      - name: Verify release secret is set
        env:
          PKGS_TOKEN_SET: ${{ secrets.PKGS_GITHUB_TOKEN != '' }}
        run: |
          if [[ "$PKGS_TOKEN_SET" != "true" ]]; then
            echo "::error::PKGS_GITHUB_TOKEN secret is not configured"
            exit 1
          fi
          echo "Cross-repository package secret verified."
      - name: Require repository immutable releases
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "${{ github.actor_id }}" == "2650679" ]]
            triggering_actor_id="$(gh api \
              "users/${TRIGGERING_ACTOR}" --jq '.id')"
            [[ "$triggering_actor_id" == "2650679" ]]
            [[ "$GITHUB_REF" == "refs/heads/main" ]]
            [[ "$GITHUB_SHA" == "${{ inputs.workflow_commit }}" ]]
            [[ "$GITHUB_WORKFLOW_SHA" == "${{ inputs.workflow_commit }}" ]]
            bash scripts/ci/verify_immutable_release_preflight.sh \
              "$RELEASE_IMMUTABLE_PREFLIGHT" \
              "$RELEASE_TAG" "$RELEASE_SOURCE_COMMIT" \
              "$RELEASE_ID" "$RELEASE_PHASE" 600
            {
              echo "### Immutable-release recovery preflight"
              echo
              echo "- actor: \`$GITHUB_ACTOR\`"
              echo "- tag: \`$RELEASE_TAG\`"
              echo "- source: \`$RELEASE_SOURCE_COMMIT\`"
              echo "- workflow: \`$GITHUB_WORKFLOW_SHA\`"
              echo "- release ID: \`$RELEASE_ID\`"
              echo "- phase: \`$RELEASE_PHASE\`"
              echo "- request: \`$(jq -r '.request_id' <<<"$RELEASE_IMMUTABLE_PREFLIGHT")\`"
              echo "- setting ETag SHA-256: \`$(jq -r '.etag_sha256' <<<"$RELEASE_IMMUTABLE_PREFLIGHT")\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            gh api \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/immutable-releases" |
              jq -e '.enabled == true' >/dev/null
          fi

      # This job is the first dependency of every publisher. Reject manual
      # prerelease or malformed tags before GoReleaser can upload an artifact or
      # open a package-manager PR.
      - name: Require stable SemVer tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::$RELEASE_TAG is not a stable SemVer tag"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" &&
                "$RELEASE_TAG" != "v0.22.0" ]]; then
            echo "::error::manual recovery is limited to the existing v0.22.0 handoff"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
            if [[ "$RELEASE_PHASE" == "publish" ]]; then
              [[ "$PREPARED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            else
              [[ "$RELEASE_PHASE" == "prepare" ]]
              [[ "$PREPARED_RUN_ID" == "0" ]]
            fi
          fi

      # The repository's active tag ruleset makes v* tags admin-created and
      # immutable. Still prove the event is the checked-out tag commit on main
      # before trusting the tag as executable release input.
      - name: Require tag commit on main
        id: tag_provenance
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          event_commit="$(git rev-parse "${RELEASE_SOURCE_COMMIT}^{commit}")"
          if [[ "$tag_commit" != "$event_commit" ]]; then
            echo "::error::tag commit $tag_commit does not match declared source commit $event_commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error::tag commit $tag_commit is not reachable from origin/main"
            exit 1
          fi
          manifest_version="$(
            git show "${tag_commit}:.release-please-manifest.json" |
              jq -er '."."'
          )"
          if [[ "v${manifest_version}" != "$RELEASE_TAG" ]]; then
            echo "::error::tag $RELEASE_TAG does not match Release Please manifest v${manifest_version} at $event_commit"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            allowed="$RUNNER_TEMP/recovery-allowed-paths"
            changed="$RUNNER_TEMP/recovery-changed-paths"
            printf '%s\n' \
              .agent-state/decisions.ndjson \
              .goreleaser.yaml \
              .github/workflows/ci.yml \
              .github/workflows/release.yml \
              docs/install.sh \
              docs/launch/release-checklist.md \
              packaging/publish-cli-manifests.sh \
              scripts/ci/build_gui_package.sh \
              scripts/ci/dispatch_release_recovery.sh \
              scripts/ci/finalize_gui_bundle.sh \
              scripts/ci/prepare_package_manifests_bundle.sh \
              scripts/ci/prepare_package_rollback_provenance.sh \
              scripts/ci/prepare_release_seal.sh \
              scripts/ci/release_by_id.sh \
              scripts/ci/release_workflow_identity.sh \
              scripts/ci/smoke_goreleaser_artifacts.sh \
              scripts/ci/test_immutable_release_recovery.sh \
              scripts/ci/test_install_signature_policy.sh \
              scripts/ci/test_prepare_package_manifests_bundle.sh \
              scripts/ci/test_prepare_package_rollback_provenance.sh \
              scripts/ci/test_prepare_release_seal.sh \
              scripts/ci/test_publish_cli_manifests.sh \
              scripts/ci/test_release_by_id.sh \
              scripts/ci/test_premerge_scoop_server_contract.py \
              scripts/ci/test_verify_release_assets.sh \
              scripts/ci/test_wait_for_package_publication.sh \
              scripts/ci/verify_immutable_release_preflight.sh \
              scripts/ci/verify_release_assets.sh \
              scripts/ci/wait_for_package_publication.sh \
              tests/releasecontrol/release_control_test.go \
              >"$allowed"
            git diff --name-only "$tag_commit" "$GITHUB_WORKFLOW_SHA" |
              LC_ALL=C sort -u >"$changed"
            if comm -23 "$changed" <(LC_ALL=C sort -u "$allowed") |
                grep -q .; then
              echo "::error::workflow commit changes product source outside the reviewed recovery allowlist"
              comm -23 "$changed" <(LC_ALL=C sort -u "$allowed") >&2
              exit 1
            fi
          fi
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

      # `force-tag-creation` creates the tag before Release Please creates its
      # draft. The tag event can therefore start this workflow first; wait for
      # the handoff instead of racing GoReleaser into creating a second draft.
      - name: Require exact Release Please release state
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_COMMIT: ${{ steps.tag_provenance.outputs.commit }}
        run: |
          for attempt in {1..12}; do
            release_id="$RELEASE_ID"
            if [[ -z "$release_id" ]]; then
              release_id="$(gh release view "$RELEASE_TAG" \
                --json databaseId --jq '.databaseId' 2>/dev/null || true)"
            fi
            if [[ "$release_id" =~ ^[1-9][0-9]*$ ]] &&
                release_state="$(gh api \
                  "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
                  2>/dev/null)"; then
              read -r id is_draft is_prerelease tag_name target_commitish < <(
                jq -er '[.id, .draft, .prerelease, .tag_name, .target_commitish] |
                  @tsv' <<<"$release_state"
              )
              if [[ "$id" != "$release_id" ]]; then
                echo "::error::release ID response mismatch"
                exit 1
              fi
              if [[ "$tag_name" != "$RELEASE_TAG" || "$target_commitish" != "$TAG_COMMIT" ]]; then
                echo "::error::release target does not match immutable tag commit $TAG_COMMIT"
                exit 1
              fi
              if [[ "$is_draft" == "true" && "$is_prerelease" == "false" ]]; then
                assets="$(jq -r '.assets[].name' <<<"$release_state")"
                seal=false
                bundle=false
                grep -Fxq release-seal.json <<<"$assets" && seal=true
                grep -Fxq release-seal.json.sigstore.json <<<"$assets" && bundle=true
                if [[ "$seal" == true && "$bundle" == true ]]; then
                  state=draft-sealed
                elif [[ "$seal" == false && "$bundle" == false ]]; then
                  state=draft-unsealed
                else
                  echo "::error::partial release seal; quarantine required"
                  exit 1
                fi
              elif [[ "$is_draft" == "false" && "$is_prerelease" == "false" ]]; then
                state=published
              else
                echo "::error::public prerelease or ambiguous release state is invalid"
                exit 1
              fi
              if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" &&
                    "$RELEASE_PHASE" == "publish" &&
                    "$state" != "draft-sealed" ]]; then
                echo "::error::publish phase requires a fully sealed prepare run"
                exit 1
              fi
              echo "state=$state" >> "$GITHUB_OUTPUT"
              echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
              echo "Release Please handoff state: $state"
              exit 0
            fi
            echo "Waiting for Release Please draft ($attempt/12)..."
            sleep 5
          done
          echo "::error::Release Please draft did not appear"
          exit 1

  goreleaser:
    name: GoReleaser (linux + macOS + windows archives, brew, scoop)
    needs: release-admission
    if: needs.release-admission.outputs.state == 'draft-unsealed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_CONTROL_REF }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0
          path: release-source
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.RELEASE_BUILD_ROOT }}/go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean --config ${{ env.GORELEASER_CONFIG }}
          workdir: ${{ env.RELEASE_BUILD_ROOT }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Smoke GoReleaser archives, native packages, and installer
        run: SOURCE_ROOT="$RELEASE_BUILD_ROOT" bash scripts/ci/smoke_goreleaser_artifacts.sh
      - name: Upload exact CLI set to admitted numeric draft
        env:
          GH_TOKEN: ${{ github.token }}
          BOUND_RELEASE_ID: ${{ needs.release-admission.outputs.release_id }}
        run: |
          set -euo pipefail
          export RELEASE_ID="$BOUND_RELEASE_ID"
          RELEASE_REPO="$GITHUB_REPOSITORY"
          release_gh() {
            gh "$@"
          }
          source scripts/ci/release_by_id.sh
          VERSION="${RELEASE_TAG#v}"
          assets=(
            "radioactive_ralph_${VERSION}_darwin_amd64.tar.gz"
            "radioactive_ralph_${VERSION}_darwin_arm64.tar.gz"
            "radioactive_ralph_${VERSION}_linux_amd64.tar.gz"
            "radioactive_ralph_${VERSION}_linux_arm64.tar.gz"
            "radioactive_ralph_${VERSION}_windows_amd64.zip"
            "radioactive-ralph_${VERSION}_linux_amd64.deb"
            "radioactive-ralph_${VERSION}_linux_arm64.deb"
            "radioactive-ralph_${VERSION}_linux_amd64.rpm"
            "radioactive-ralph_${VERSION}_linux_arm64.rpm"
            checksums.txt
            checksums.txt.sigstore.json
          )
          for asset in "${assets[@]}"; do
            ralph_release_upload_asset \
              "$RELEASE_TAG" "$RELEASE_SOURCE_COMMIT" \
              "$RELEASE_BUILD_ROOT/dist/$asset" replace-before-seal
          done
      - name: Retain generated CLI package manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-cli-package-manifests
          path: |
            ${{ env.RELEASE_BUILD_ROOT }}/dist/homebrew/Casks/radioactive-ralph.rb
            ${{ env.RELEASE_BUILD_ROOT }}/dist/scoop/bucket/radioactive-ralph.json
          if-no-files-found: error

  gui-bundles:
    name: GUI bundle (${{ matrix.os }})
    needs: [release-admission, goreleaser]
    if: needs.release-admission.outputs.state == 'draft-unsealed'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two macOS legs so both Mac architectures get a native .app/.dmg:
          # macos-latest is arm64 (Apple Silicon), macos-15-intel is amd64
          # (Intel — the current GitHub-hosted Intel runner; macos-13 is retired).
          - os: macos-latest
            target: darwin
            arch: arm64
            artifact: gui-darwin-arm64
          - os: macos-15-intel
            target: darwin
            arch: amd64
            artifact: gui-darwin-amd64
          - os: ubuntu-latest
            target: linux
            artifact: gui-linux-amd64
          - os: windows-latest
            target: windows
            artifact: gui-windows-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_CONTROL_REF }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0
          path: release-source
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.RELEASE_BUILD_ROOT }}/go.mod
      # Linux GUI build needs the GL/X11/Wayland dev headers (same set the CI
      # `gui` job installs) for glfw to link.
      - name: Install Linux GUI dev headers
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols
      - name: Install the fyne packaging CLI
        run: go install fyne.io/tools/cmd/fyne@v1.7.2
      - name: Build, package, and smoke exact GUI executable
        shell: bash
        timeout-minutes: 30
        run: |
          SOURCE_ROOT="$RELEASE_BUILD_ROOT" \
            bash scripts/ci/build_gui_package.sh \
            "${RELEASE_TAG#v}" \
            "${{ matrix.target }}"
      - name: Finalize and smoke macOS DMG or Linux AppImage
        if: matrix.target != 'windows'
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          ARCH="${{ matrix.arch }}"
          [[ -n "$ARCH" ]] || ARCH=x86_64
          SOURCE_ROOT="$RELEASE_BUILD_ROOT" \
            bash scripts/ci/finalize_gui_bundle.sh \
            "$VERSION" "${{ matrix.target }}" "$ARCH"
      # Windows: Authenticode-sign the .exe via the free SignPath Foundation OSS
      # program WHEN enrolled (the SIGNPATH_* secrets are set). Absent the
      # secrets this step is skipped and the .exe ships unsigned — SmartScreen
      # will warn until the (free) enrollment token is added. Gated with a tiny
      # bash check because `secrets.*` can't be used in a step `if:` directly.
      - name: Check SignPath prerequisites (Windows)
        id: signpath_prereq
        if: matrix.target == 'windows'
        shell: bash
        env:
          SIGNPATH_TOKEN_SET: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        run: |
          if [[ "$SIGNPATH_TOKEN_SET" == "true" ]]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "SignPath not configured — the Windows .exe ships unsigned."
            echo "sign=false" >> "$GITHUB_OUTPUT"
          fi
      # SignPath v2 signs a GitHub Actions artifact: upload the unsigned .exe,
      # submit it for signing, and the action downloads the signed .exe back in
      # place (overwriting the unsigned one before the release upload below).
      - name: Stage the unsigned .exe as an artifact (Windows/SignPath)
        if: matrix.target == 'windows' && steps.signpath_prereq.outputs.sign == 'true'
        id: exe_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: radioactive-ralph-exe-unsigned
          path: ${{ env.RELEASE_BUILD_ROOT }}/*.exe
      - name: Authenticode-sign the .exe (SignPath, Windows)
        if: matrix.target == 'windows' && steps.signpath_prereq.outputs.sign == 'true'
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: radioactive-ralph
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.exe_artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ env.RELEASE_BUILD_ROOT }}
      - name: Smoke packaged .exe (Windows)
        if: matrix.target == 'windows'
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          EXE="$(find "$RELEASE_BUILD_ROOT" -maxdepth 1 -name '*.exe' | head -n 1)"
          test -n "$EXE"
          "$EXE" --version | grep -F "$VERSION"
          go version -m "$EXE" | grep -F $'dep\tfyne.io/fyne/v2'
      - name: Retain GUI bundle for the narrow signer/uploader
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ env.RELEASE_BUILD_ROOT }}/*.dmg
            ${{ env.RELEASE_BUILD_ROOT }}/*.AppImage
            ${{ env.RELEASE_BUILD_ROOT }}/*.exe
          if-no-files-found: error
          retention-days: 1
      - name: Reject ambiguous GUI bundle output
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            "$RELEASE_BUILD_ROOT"/*.dmg
            "$RELEASE_BUILD_ROOT"/*.AppImage
            "$RELEASE_BUILD_ROOT"/*.exe
          )
          if [ ${#assets[@]} -ne 1 ]; then
            echo "::error::expected exactly one GUI bundle for ${{ matrix.target }}, found ${#assets[@]}"
            exit 1
          fi

  sign-gui-checksums:
    name: Sign GUI checksum manifest
    needs: [release-admission, gui-bundles]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_CONTROL_REF }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.1
        with:
          pattern: gui-*
          path: gui-assets
          merge-multiple: true
      - name: Download, hash, sign, and upload the exact GUI set
        env:
          GH_TOKEN: ${{ github.token }}
          BOUND_RELEASE_ID: ${{ needs.release-admission.outputs.release_id }}
        run: |
          set -euo pipefail
          export RELEASE_ID="$BOUND_RELEASE_ID"
          RELEASE_REPO="$GITHUB_REPOSITORY"
          release_gh() {
            gh "$@"
          }
          source "$GITHUB_WORKSPACE/scripts/ci/release_by_id.sh"
          VERSION="${RELEASE_TAG#v}"
          cd gui-assets
          expected=(
            "radioactive-ralph_${VERSION}_darwin_amd64.dmg"
            "radioactive-ralph_${VERSION}_darwin_arm64.dmg"
            "radioactive-ralph_${VERSION}_linux_x86_64.AppImage"
            "radioactive-ralph.exe"
          )
          actual="$(find . -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)"
          wanted="$(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)"
          [[ "$actual" == "$wanted" ]]
          sha256sum "${expected[@]}" | LC_ALL=C sort -k2 \
            > gui-checksums.txt
          cosign sign-blob \
            --bundle gui-checksums.txt.sigstore.json \
            gui-checksums.txt \
            --yes
          for asset in \
            "${expected[@]}" \
            gui-checksums.txt \
            gui-checksums.txt.sigstore.json; do
            ralph_release_upload_asset \
              "$RELEASE_TAG" "$RELEASE_SOURCE_COMMIT" \
              "$asset" replace-before-seal
          done

  package-rollback-provenance:
    name: Sign original package rollback provenance
    needs: [release-admission, goreleaser, sign-gui-checksums]
    if: needs.release-admission.outputs.state == 'draft-unsealed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_CONTROL_REF }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Capture once or verify original package bytes
        env:
          PKGS_GH_TOKEN: ${{ secrets.PKGS_GITHUB_TOKEN }}
          RELEASE_GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release-admission.outputs.release_id }}
        run: |
          bash scripts/ci/prepare_package_rollback_provenance.sh \
            "${RELEASE_TAG#v}"

  package-manifests-bundle:
    name: Sign durable atomic package manifests
    needs: [release-admission, goreleaser, sign-gui-checksums]
    if: needs.release-admission.outputs.state == 'draft-unsealed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_CONTROL_REF }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.1
        with:
          name: generated-cli-package-manifests
          path: dist
      - name: Sign exact three-file package PR payload
        env:
          RELEASE_GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release-admission.outputs.release_id }}
        run: |
          bash scripts/ci/prepare_package_manifests_bundle.sh \
            "${RELEASE_TAG#v}"

  release-seal:
    name: Sign create-last immutable release seal
    needs:
      [release-admission, package-rollback-provenance, package-manifests-bundle]
    if: needs.release-admission.outputs.state == 'draft-unsealed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_CONTROL_REF }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Seal or verify every draft byte
        env:
          RELEASE_GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release-admission.outputs.release_id }}
        run: |
          bash scripts/ci/prepare_release_seal.sh \
            "${RELEASE_TAG#v}" "$RELEASE_SOURCE_COMMIT" \
            "${{ needs.release-admission.outputs.release_id }}" \
            "$RELEASE_WORKFLOW_COMMIT"

  verify-sealed-release:
    name: Verify sealed draft before package mutation
    needs: [release-admission, release-seal]
    if: >-
      always() &&
      (needs.release-admission.outputs.state == 'draft-sealed' ||
       (needs.release-admission.outputs.state == 'draft-unsealed' &&
        needs.release-seal.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_CONTROL_REF }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify exact sealed release bytes
        env:
          RELEASE_GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release-admission.outputs.release_id }}
        run: bash scripts/ci/verify_release_assets.sh "${RELEASE_TAG#v}"

  package-manifests:
    name: Publish atomic package manifest PR
    needs: [release-admission, verify-sealed-release]
    if: needs.verify-sealed-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_CONTROL_REF }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Publish generated Homebrew and Scoop manifests
        env:
          PKGS_GH_TOKEN: ${{ secrets.PKGS_GITHUB_TOKEN }}
          RELEASE_GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release-admission.outputs.release_id }}
          RESOLVE_PACKAGE_ATTEMPT_BRANCH: '1'
        run: bash packaging/publish-cli-manifests.sh "${RELEASE_TAG#v}"

  chocolatey:
    name: Optional Chocolatey publish after immutable release
    needs: publish-release
    runs-on: windows-latest
    permissions:
      contents: read
    # GitHub does not allow `secrets.*` in jobs.<job_id>.if, so we gate
    # the optional publish path with a tiny first step before checkout.
    if: vars.ENABLE_CHOCOLATEY == 'true'
    steps:
      - name: Check chocolatey publish prerequisites
        id: prereq
        shell: bash
        env:
          CHOCO_TOKEN_SET: ${{ secrets.CHOCOLATEY_API_KEY != '' }}
        run: |
          if [[ "$CHOCO_TOKEN_SET" != "true" ]]; then
            echo "Chocolatey publish skipped: CHOCOLATEY_API_KEY is not configured."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "Chocolatey publish prerequisites satisfied."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.prereq.outputs.should_publish == 'true'
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.prereq.outputs.should_publish == 'true'
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        if: steps.prereq.outputs.should_publish == 'true'
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean --config .goreleaser.chocolatey.yaml
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}

  verify-package-heads:
    name: Verify exact package PR heads
    needs: [release-admission, package-manifests, release-seal]
    if: >-
      always() &&
      (needs.release-admission.outputs.state == 'draft-unsealed' ||
       needs.release-admission.outputs.state == 'draft-sealed') &&
      needs.package-manifests.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      package_head_oid: ${{ steps.package_heads.outputs.package_head_oid }}
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ env.RELEASE_CONTROL_REF }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify trusted exact PR heads without merging
        id: package_heads
        env:
          PKGS_GH_TOKEN: ${{ secrets.PKGS_GITHUB_TOKEN }}
          RELEASE_GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release-admission.outputs.release_id }}
          PACKAGE_GATE_MODE: verify-heads
          RESOLVE_PACKAGE_ATTEMPT_BRANCH: '1'
        run: bash scripts/ci/wait_for_package_publication.sh "${RELEASE_TAG#v}"

  premerge-package-smoke:
    name: Premerge package smoke (${{ matrix.channel }})
    needs: [release-admission, verify-package-heads]
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.phase == 'prepare'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: homebrew-exact-heads
            os: macos-latest
          - channel: scoop-exact-head
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.channel == 'homebrew-exact-heads'
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_CONTROL_REF }}
      - name: Install exact Homebrew PR-head casks
        if: matrix.channel == 'homebrew-exact-heads'
        shell: bash
        env:
          PKGS_GH_TOKEN: ${{ secrets.PKGS_GITHUB_TOKEN }}
          RELEASE_GH_TOKEN: ${{ github.token }}
          PACKAGE_HEAD: ${{ needs.verify-package-heads.outputs.package_head_oid }}
          BOUND_RELEASE_ID: ${{ needs.release-admission.outputs.release_id }}
        run: |
          set -euo pipefail
          export RELEASE_ID="$BOUND_RELEASE_ID"
          RELEASE_REPO="$GITHUB_REPOSITORY"
          release_gh() {
            GH_TOKEN="$RELEASE_GH_TOKEN" gh "$@"
          }
          source scripts/ci/release_by_id.sh
          VERSION="${RELEASE_TAG#v}"
          mkdir exact-casks premerge-assets
          GH_TOKEN="$PKGS_GH_TOKEN" gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/jbcom/pkgs/contents/Casks/radioactive-ralph.rb?ref=$PACKAGE_HEAD" \
            > exact-casks/radioactive-ralph.rb
          GH_TOKEN="$PKGS_GH_TOKEN" gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/jbcom/pkgs/contents/Casks/radioactive-ralph-gui.rb?ref=$PACKAGE_HEAD" \
            > exact-casks/radioactive-ralph-gui.rb
          for asset in \
            "radioactive_ralph_${VERSION}_darwin_arm64.tar.gz" \
            "radioactive-ralph_${VERSION}_darwin_arm64.dmg"; do
            ralph_release_download_asset \
              "$RELEASE_TAG" "$RELEASE_SOURCE_COMMIT" draft "$asset" \
              "premerge-assets/$asset"
            case "$asset" in
              radioactive_ralph_*.tar.gz)
                cask=exact-casks/radioactive-ralph.rb
                ;;
              radioactive-ralph_*.dmg)
                cask=exact-casks/radioactive-ralph-gui.rb
                ;;
              *)
                exit 1
                ;;
            esac
            bash scripts/ci/rewrite_homebrew_cask_url.sh \
              "$cask" "$VERSION" "$asset" "$PWD/premerge-assets/$asset"
          done
      - name: Install cached exact Homebrew PR-head casks without credentials
        if: matrix.channel == 'homebrew-exact-heads'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          unset GH_TOKEN PKGS_GH_TOKEN RELEASE_GH_TOKEN
          if git config --local --get-regexp '^http\..*\.extraheader$' \
            >/dev/null 2>&1; then
            echo "checkout credential remained before cask execution" >&2
            exit 1
          fi
          HOMEBREW_NO_INSTALL_FROM_API=1 brew install --cask \
            "$PWD/exact-casks/radioactive-ralph.rb" \
            "$PWD/exact-casks/radioactive-ralph-gui.rb"
          radioactive_ralph --version | grep -F "$VERSION"
          GUI_BIN="$(find /Applications/radioactive-ralph.app/Contents/MacOS \
            -type f -perm -u+x | head -n 1)"
          "$GUI_BIN" --version | grep -F "$VERSION"
      - name: Install pinned Scoop
        if: matrix.channel == 'scoop-exact-head'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            https://raw.githubusercontent.com/ScoopInstaller/Install/b0ee913725139b816f9178163af0aecdba07a7ed/install.ps1 `
            -OutFile install-scoop.ps1
          ./install-scoop.ps1 -RunAsAdmin
      - name: Install exact Scoop PR-head manifest
        if: matrix.channel == 'scoop-exact-head'
        shell: pwsh
        env:
          PKGS_GH_TOKEN: ${{ secrets.PKGS_GITHUB_TOKEN }}
          RELEASE_GH_TOKEN: ${{ github.token }}
          PACKAGE_HEAD: ${{ needs.verify-package-heads.outputs.package_head_oid }}
          BOUND_RELEASE_ID: ${{ needs.release-admission.outputs.release_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory exact-scoop | Out-Null
          $env:GH_TOKEN = $env:PKGS_GH_TOKEN
          gh api -H "Accept: application/vnd.github.raw+json" `
            "repos/jbcom/pkgs/contents/bucket/radioactive-ralph.json?ref=$env:PACKAGE_HEAD" `
            > exact-scoop/radioactive-ralph.json
          if ($LASTEXITCODE -ne 0) {
            throw "failed to fetch exact Scoop manifest at $env:PACKAGE_HEAD"
          }
          $version = $env:RELEASE_TAG.Substring(1)
          $asset = "radioactive_ralph_${version}_windows_amd64.zip"
          $env:GH_TOKEN = $env:RELEASE_GH_TOKEN
          $release = gh api `
            "repos/$env:GITHUB_REPOSITORY/releases/$env:BOUND_RELEASE_ID" |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or
              $release.id -ne [int64]$env:BOUND_RELEASE_ID -or
              $release.tag_name -ne $env:RELEASE_TAG -or
              $release.target_commitish -ne $env:RELEASE_SOURCE_COMMIT -or
              -not $release.draft -or $release.prerelease) {
            throw "numeric draft no longer matches the admitted release"
          }
          $assets = gh api --paginate --slurp `
            "repos/$env:GITHUB_REPOSITORY/releases/$env:BOUND_RELEASE_ID/assets?per_page=100" |
            ConvertFrom-Json
          $matches = @($assets | ForEach-Object { $_ } |
            Where-Object { $_.name -eq $asset -and $_.state -eq 'uploaded' })
          if ($LASTEXITCODE -ne 0 -or $matches.Count -ne 1) {
            throw "exact draft asset is absent or duplicated"
          }
          gh api -H "Accept: application/octet-stream" `
            "repos/$env:GITHUB_REPOSITORY/releases/assets/$($matches[0].id)" `
            > "exact-scoop/$asset"
          if ($LASTEXITCODE -ne 0) {
            throw "failed to cache exact draft asset $asset"
          }

          $manifestPath = "exact-scoop/radioactive-ralph.json"
          $assetPath = "exact-scoop/$asset"
          $manifest = Get-Content -Raw $manifestPath | ConvertFrom-Json
          $expectedAssetUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$asset"
          $originalAssetUrl = $manifest.architecture.'64bit'.url
          $originalAssetHash = $manifest.architecture.'64bit'.hash
          if ($originalAssetUrl -ne $expectedAssetUrl) {
            throw "Scoop manifest URL $originalAssetUrl does not name exact draft asset $expectedAssetUrl"
          }
          if ($originalAssetHash -notmatch '^[0-9a-fA-F]{64}$') {
            throw "Scoop manifest hash is not a SHA-256 digest"
          }
          $cachedAssetHash = (Get-FileHash -Algorithm SHA256 $assetPath).Hash
          if ($cachedAssetHash -ne $originalAssetHash) {
            throw "cached draft asset hash does not match exact Scoop manifest"
          }

          $localAssetUrl = "http://127.0.0.1:8123/$asset"
          $manifest.architecture.'64bit'.url = $localAssetUrl
          $manifest | ConvertTo-Json -Depth 20 |
            Set-Content -Path $manifestPath -Encoding utf8NoBOM
          $rewrittenManifest = Get-Content -Raw $manifestPath | ConvertFrom-Json
          if ($rewrittenManifest.architecture.'64bit'.url -ne $localAssetUrl -or
              $rewrittenManifest.architecture.'64bit'.hash -ne $originalAssetHash) {
            throw "local Scoop rewrite changed more than the exact draft asset URL"
          }
      - name: Install cached exact Scoop manifest without credentials
        if: matrix.channel == 'scoop-exact-head'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $credentialNames = @('GH_TOKEN', 'PKGS_GH_TOKEN', 'RELEASE_GH_TOKEN')
          foreach ($credentialName in $credentialNames) {
            Remove-Item "Env:$credentialName" -ErrorAction SilentlyContinue
          }
          foreach ($credentialName in $credentialNames) {
            if (Test-Path "Env:$credentialName") {
              throw "$credentialName remained before credential-free Scoop execution"
            }
          }

          $version = $env:RELEASE_TAG.Substring(1)
          $asset = "radioactive_ralph_${version}_windows_amd64.zip"
          $assetPath = "$PWD/exact-scoop/$asset"
          $assetUrl = "http://127.0.0.1:8123/$asset"
          $serverStdout = "$env:RUNNER_TEMP/scoop-http.stdout.log"
          $serverStderr = "$env:RUNNER_TEMP/scoop-http.stderr.log"
          $server = $null
          try {
            $server = Start-Process -FilePath python -ArgumentList @(
              '-m', 'http.server', '8123',
              '--bind', '127.0.0.1',
              '--directory', 'exact-scoop'
            ) -RedirectStandardOutput $serverStdout `
              -RedirectStandardError $serverStderr -PassThru

            $ready = $false
            $expectedLength = (Get-Item -LiteralPath $assetPath).Length
            for ($attempt = 1; $attempt -le 20; $attempt++) {
              if ($server.HasExited) {
                break
              }
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Method Head `
                  -TimeoutSec 1 -Uri $assetUrl
                if ($response.StatusCode -eq 200 -and
                    [int64]$response.Headers.'Content-Length' -eq $expectedLength) {
                  $ready = $true
                  break
                }
              } catch {
                # The bounded poll below owns readiness; retry transient refusal.
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) {
              if (Test-Path $serverStdout) {
                Get-Content $serverStdout | Write-Host
              }
              if (Test-Path $serverStderr) {
                Get-Content $serverStderr | Write-Host
              }
              if ($server.HasExited) {
                throw "cached asset server exited before readiness with code $($server.ExitCode)"
              }
              throw "cached asset server never served the exact asset after 20 bounded attempts"
            }

            foreach ($credentialName in $credentialNames) {
              if (Test-Path "Env:$credentialName") {
                throw "$credentialName appeared before credential-free Scoop execution"
              }
            }
            scoop install "$PWD/exact-scoop/radioactive-ralph.json"
            if ($LASTEXITCODE -ne 0) {
              throw "Scoop failed to install the exact cached PR-head manifest"
            }
            $versionOutput = radioactive_ralph --version
            if ($LASTEXITCODE -ne 0) {
              throw "installed radioactive_ralph failed its version command"
            }
            if (-not ($versionOutput | Select-String -Quiet -SimpleMatch $version)) {
              throw "installed radioactive_ralph version did not contain $version"
            }
          } finally {
            if ($null -ne $server) {
              try {
                if (-not $server.HasExited) {
                  Stop-Process -InputObject $server -Force `
                    -ErrorAction SilentlyContinue
                }
                if (-not $server.WaitForExit(10000)) {
                  throw "cached asset server did not stop within 10 seconds"
                }
              } finally {
                $server.Dispose()
              }
            }
          }

  release-readiness:
    name: Sign prepared release readiness
    needs:
      [release-admission, verify-sealed-release, verify-package-heads, premerge-package-smoke]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.phase == 'prepare' &&
      needs.verify-sealed-release.result == 'success' &&
      needs.verify-package-heads.result == 'success' &&
      needs.premerge-package-smoke.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign exact preparation result
        env:
          PACKAGE_HEAD_OID: ${{ needs.verify-package-heads.outputs.package_head_oid }}
          BOUND_RELEASE_ID: ${{ needs.release-admission.outputs.release_id }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_HEAD_OID" =~ ^[0-9a-f]{40,64}$ ]]
          [[ "$BOUND_RELEASE_ID" == "$RELEASE_ID" ]]
          jq -S -n \
            --arg tag "$RELEASE_TAG" \
            --arg source "$RELEASE_SOURCE_COMMIT" \
            --arg workflow "$RELEASE_WORKFLOW_COMMIT" \
            --arg package_head "$PACKAGE_HEAD_OID" \
            --argjson release_id "$RELEASE_ID" \
            --argjson run_id "$GITHUB_RUN_ID" \
            '{
              schema: 1,
              phase: "prepare",
              tag: $tag,
              source_commit: $source,
              release_id: $release_id,
              workflow_commit: $workflow,
              prepared_run_id: $run_id,
              package_head_oid: $package_head
            }' > release-readiness.json
          cosign sign-blob release-readiness.json \
            --bundle release-readiness.json.sigstore.json --yes
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-readiness-v0.22.0
          path: |
            release-readiness.json
            release-readiness.json.sigstore.json
          if-no-files-found: error
          retention-days: 1

  verify-release-readiness:
    name: Verify signed prepared release readiness
    needs: release-admission
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.phase == 'publish'
    runs-on: ubuntu-latest
    outputs:
      package_head_oid: ${{ steps.readiness.outputs.package_head_oid }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify exact successful prepare run and signed result
        id: readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PREPARED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          work="$RUNNER_TEMP/release-readiness"
          mkdir "$work"
          run="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PREPARED_RUN_ID}")"
          jq -e \
            --arg sha "$RELEASE_WORKFLOW_COMMIT" \
            --argjson actor_id 2650679 \
            '.id > 0 and .event == "workflow_dispatch" and
             .status == "completed" and .conclusion == "success" and
             .head_sha == $sha and .actor.id == $actor_id and
             .triggering_actor.id == $actor_id and
             .path == ".github/workflows/release.yml"' \
            <<<"$run" >/dev/null
          artifacts="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PREPARED_RUN_ID}/artifacts?name=release-readiness-v0.22.0")"
          artifact_id="$(jq -er \
            '[.artifacts[] | select(
              .name == "release-readiness-v0.22.0" and
              .expired == false
            )] | select(length == 1) | .[0].id' <<<"$artifacts")"
          gh api -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > "$work/readiness.zip"
          listing="$(unzip -Z1 "$work/readiness.zip" | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            release-readiness.json \
            release-readiness.json.sigstore.json | LC_ALL=C sort)"
          [[ "$listing" == "$expected" ]]
          unzip -q "$work/readiness.zip" -d "$work"
          cosign verify-blob "$work/release-readiness.json" \
            --bundle "$work/release-readiness.json.sigstore.json" \
            --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main" \
            --certificate-github-workflow-sha "$RELEASE_WORKFLOW_COMMIT" \
            --certificate-github-workflow-trigger workflow_dispatch \
            --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com" >/dev/null
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg source "$RELEASE_SOURCE_COMMIT" \
            --arg workflow "$RELEASE_WORKFLOW_COMMIT" \
            --argjson release_id "$RELEASE_ID" \
            --argjson run_id "$PREPARED_RUN_ID" \
            '.schema == 1 and .phase == "prepare" and
             .tag == $tag and .source_commit == $source and
             .release_id == $release_id and
             .workflow_commit == $workflow and
             .prepared_run_id == $run_id and
             (.package_head_oid | test("^[0-9a-f]{40,64}$")) and
             (keys | sort) == [
               "package_head_oid", "phase", "prepared_run_id", "release_id",
               "schema", "source_commit", "tag", "workflow_commit"
             ]' "$work/release-readiness.json" >/dev/null
          package_head="$(jq -er '.package_head_oid' \
            "$work/release-readiness.json")"
          echo "package_head_oid=$package_head" >> "$GITHUB_OUTPUT"

  publish-release:
    name: Commit packages and publish immutable stable release
    needs:
      [release-admission, verify-sealed-release, verify-package-heads, premerge-package-smoke, verify-release-readiness]
    if: >-
      always() &&
      needs.verify-sealed-release.result == 'success' &&
      needs.verify-package-heads.result == 'success' &&
      (
        (github.event_name != 'workflow_dispatch' &&
         needs.premerge-package-smoke.result == 'success') ||
        (github.event_name == 'workflow_dispatch' &&
         inputs.phase == 'publish' &&
         needs.premerge-package-smoke.result == 'skipped' &&
         needs.verify-release-readiness.result == 'success')
      )
    runs-on: ubuntu-latest
    outputs:
      pkgs_main_oid: ${{ steps.transaction.outputs.pkgs_main_oid }}
      package_release_merge_oid: ${{ steps.transaction.outputs.package_release_merge_oid }}
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ env.RELEASE_CONTROL_REF }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Merge exact smoked head and immediately publish once
        id: transaction
        env:
          PKGS_GH_TOKEN: ${{ secrets.PKGS_GITHUB_TOKEN }}
          RELEASE_GH_TOKEN: ${{ github.token }}
          EXPECTED_PACKAGE_HEAD_OID: ${{ needs.verify-package-heads.outputs.package_head_oid }}
          READINESS_PACKAGE_HEAD_OID: ${{ needs.verify-release-readiness.outputs.package_head_oid }}
          RELEASE_ID: ${{ needs.release-admission.outputs.release_id }}
          RESOLVE_PACKAGE_ATTEMPT_BRANCH: '1'
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$EXPECTED_PACKAGE_HEAD_OID" == "$READINESS_PACKAGE_HEAD_OID" ]]
          fi
          VERSION="${RELEASE_TAG#v}"
          provenance="$RUNNER_TEMP/package-rollback.tar.gz"
          RELEASE_REPO="$GITHUB_REPOSITORY"
          release_gh() {
            GH_TOKEN="$RELEASE_GH_TOKEN" gh "$@"
          }
          source scripts/ci/release_by_id.sh
          ralph_release_download_asset \
            "$RELEASE_TAG" "$RELEASE_SOURCE_COMMIT" draft \
            package-rollback.tar.gz "$provenance"
          require_immutable_release_authority() {
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              bash scripts/ci/verify_immutable_release_preflight.sh \
                "$RELEASE_IMMUTABLE_PREFLIGHT" \
                "$RELEASE_TAG" "$RELEASE_SOURCE_COMMIT" \
                "$RELEASE_ID" "$RELEASE_PHASE" 600
            else
              GH_TOKEN="$RELEASE_GH_TOKEN" gh api \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "repos/${GITHUB_REPOSITORY}/immutable-releases" |
                jq -e '.enabled == true' >/dev/null
            fi
          }
          pkgs_main_oid=""
          package_release_merge_oid=""
          resolve_winning_merge() {
            local resolve_output
            resolve_output="$RUNNER_TEMP/package-merged-output"
            : > "$resolve_output"
            PACKAGE_GATE_MODE=resolve-merged GITHUB_OUTPUT="$resolve_output" \
              bash scripts/ci/wait_for_package_publication.sh "$VERSION"
            pkgs_main_oid="$(
              sed -n 's/^pkgs_main_oid=//p' "$resolve_output" | tail -n 1
            )"
            package_release_merge_oid="$(
              sed -n 's/^package_release_merge_oid=//p' "$resolve_output" |
                tail -n 1
            )"
            [[ "$pkgs_main_oid" =~ ^[0-9a-f]{40,64}$ ]]
            [[ "$package_release_merge_oid" =~ ^[0-9a-f]{40,64}$ ]]
          }
          compensate() {
            status=$?
            trap - EXIT
            final_state="$(GH_TOKEN="$RELEASE_GH_TOKEN" gh api \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              2>/dev/null || true)"
            if jq -e --argjson id "$RELEASE_ID" \
              --arg tag "$RELEASE_TAG" --arg target "$RELEASE_SOURCE_COMMIT" \
              '.id == $id and .draft == false and .prerelease == false and
               .immutable == true and .tag_name == $tag and
               .target_commitish == $target' <<<"$final_state" >/dev/null 2>&1; then
              latest_id="$(GH_TOKEN="$RELEASE_GH_TOKEN" gh api --jq '.id' \
                "repos/${GITHUB_REPOSITORY}/releases/latest")" || exit 1
              [[ "$latest_id" == "$(jq -r '.id' <<<"$final_state")" ]] || exit 1
              resolve_winning_merge || exit 1
              {
                echo "pkgs_main_oid=$pkgs_main_oid"
                echo "package_release_merge_oid=$package_release_merge_oid"
              } >> "$GITHUB_OUTPUT"
              echo "::warning::publication response was uncertain; stable immutable state was verified by fresh reads"
              exit 0
            fi
            if ! jq -e --argjson id "$RELEASE_ID" \
              --arg tag "$RELEASE_TAG" --arg target "$RELEASE_SOURCE_COMMIT" \
              '.id == $id and .draft == true and .prerelease == false and
               .tag_name == $tag and .target_commitish == $target' \
              <<<"$final_state" >/dev/null 2>&1; then
              echo "::error::ambiguous publication state; quarantining without blind compensation"
              exit 1
            fi
            if resolve_winning_merge; then
              echo "::error::draft transaction failed after package merge; compensating protected main"
              bash scripts/ci/rollback_package_manifests.sh \
                "$VERSION" "$provenance" "$package_release_merge_oid" || status=1
            else
              echo "::warning::no unique current release-owned package merge was recoverable; quarantining"
            fi
            exit "$status"
          }
          trap compensate EXIT

          require_immutable_release_authority
          current_manifest="$(GH_TOKEN="$RELEASE_GH_TOKEN" gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/${GITHUB_REPOSITORY}/contents/.release-please-manifest.json?ref=main")"
          [[ "$(jq -er '."."' <<<"$current_manifest")" == "$VERSION" ]]
          tag_sha="$(GH_TOKEN="$RELEASE_GH_TOKEN" gh api \
            --jq '.object.sha' "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
          [[ "$tag_sha" == "$RELEASE_SOURCE_COMMIT" ]]
          bash scripts/ci/verify_release_assets.sh "$VERSION"
          release="$(GH_TOKEN="$RELEASE_GH_TOKEN" gh api \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          release_id="$(jq -er '.id' <<<"$release")"
          [[ "$release_id" == "$RELEASE_ID" ]]
          jq -e --argjson id "$RELEASE_ID" \
            --arg tag "$RELEASE_TAG" --arg target "$RELEASE_SOURCE_COMMIT" \
            '.id == $id and .draft == true and .prerelease == false and
             .tag_name == $tag and .target_commitish == $target' \
            <<<"$release" >/dev/null

          gate_output="$RUNNER_TEMP/package-gate-output"
          GITHUB_OUTPUT="$gate_output" PACKAGE_GATE_MODE=merge \
            bash scripts/ci/wait_for_package_publication.sh "$VERSION"
          pkgs_main_oid="$(sed -n 's/^pkgs_main_oid=//p' "$gate_output" | tail -n 1)"
          package_release_merge_oid="$(
            sed -n 's/^package_release_merge_oid=//p' "$gate_output" |
              tail -n 1
          )"
          [[ "$pkgs_main_oid" =~ ^[0-9a-f]{40,64}$ ]]
          [[ "$package_release_merge_oid" =~ ^[0-9a-f]{40,64}$ ]]

          # Complete all slow package and asset verification first. Then make
          # the authority reads below the final operations before PATCH.
          resolve_winning_merge
          bash scripts/ci/verify_release_assets.sh "$VERSION"
          EXPECTED_PACKAGE_RELEASE_MERGE_OID="$package_release_merge_oid" \
            PACKAGE_GATE_MODE=recheck-current \
            bash scripts/ci/wait_for_package_publication.sh "$VERSION"
          require_immutable_release_authority
          current_manifest="$(GH_TOKEN="$RELEASE_GH_TOKEN" gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/${GITHUB_REPOSITORY}/contents/.release-please-manifest.json?ref=main")"
          [[ "$(jq -er '."."' <<<"$current_manifest")" == "$VERSION" ]]
          tag_sha="$(GH_TOKEN="$RELEASE_GH_TOKEN" gh api \
            --jq '.object.sha' \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
          [[ "$tag_sha" == "$RELEASE_SOURCE_COMMIT" ]]
          release="$(GH_TOKEN="$RELEASE_GH_TOKEN" gh api \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          release_id="$(jq -er '.id' <<<"$release")"
          [[ "$release_id" == "$RELEASE_ID" ]]
          jq -e --argjson id "$RELEASE_ID" \
            --arg tag "$RELEASE_TAG" --arg target "$RELEASE_SOURCE_COMMIT" \
            '.id == $id and .draft == true and .prerelease == false and
             .tag_name == $tag and .target_commitish == $target' \
            <<<"$release" >/dev/null

          response=""
          if ! response="$(GH_TOKEN="$RELEASE_GH_TOKEN" gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false -F prerelease=false -f make_latest=true)"; then
            echo "::warning::publication PATCH transport failed; resolving fresh release state"
          fi
          final="$(GH_TOKEN="$RELEASE_GH_TOKEN" gh api \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          if ! jq -e --argjson id "$release_id" --arg tag "$RELEASE_TAG" \
            --arg target "$RELEASE_SOURCE_COMMIT" \
            '.id == $id and .draft == false and .prerelease == false and
             .immutable == true and .tag_name == $tag and
             .target_commitish == $target' <<<"$response" >/dev/null 2>&1; then
            echo "::warning::PATCH response was absent or non-canonical; fresh state is authoritative"
          fi
          latest="$(GH_TOKEN="$RELEASE_GH_TOKEN" gh api \
            "repos/${GITHUB_REPOSITORY}/releases/latest")"
          jq -e --argjson id "$release_id" --arg tag "$RELEASE_TAG" \
            --arg target "$RELEASE_SOURCE_COMMIT" \
            '.id == $id and .immutable == true and .draft == false and
             .prerelease == false and .tag_name == $tag and
             .target_commitish == $target' <<<"$final" >/dev/null
          jq -e --argjson id "$release_id" --arg tag "$RELEASE_TAG" \
            '.id == $id and .tag_name == $tag and .immutable == true' \
            <<<"$latest" >/dev/null
          {
            echo "pkgs_main_oid=$pkgs_main_oid"
            echo "package_release_merge_oid=$package_release_merge_oid"
          } >> "$GITHUB_OUTPUT"
          trap - EXIT

  official-channel-smoke:
    name: Official channel smoke (${{ matrix.channel }})
    needs: publish-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: homebrew-cli-gui-arm64
            os: macos-latest
          - channel: homebrew-cli-gui-amd64
            os: macos-15-intel
          - channel: scoop
            os: windows-latest
          - channel: linux-direct-amd64
            os: ubuntu-latest
          - channel: linux-direct-arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: startsWith(matrix.channel, 'linux-direct')
        with:
          ref: ${{ env.RELEASE_CONTROL_REF }}
      - name: Smoke official Homebrew CLI and GUI casks
        if: startsWith(matrix.channel, 'homebrew-cli-gui')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          brew tap jbcom/pkgs https://github.com/jbcom/pkgs
          HOMEBREW_NO_INSTALL_FROM_API=1 brew install --cask \
            radioactive-ralph radioactive-ralph-gui
          radioactive_ralph --version | grep -F "$VERSION"
          GUI_BIN="$(find /Applications/radioactive-ralph.app/Contents/MacOS \
            -type f -perm -u+x | head -n 1)"
          "$GUI_BIN" --version | grep -F "$VERSION"
      - name: Install pinned Scoop
        if: matrix.channel == 'scoop'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            https://raw.githubusercontent.com/ScoopInstaller/Install/b0ee913725139b816f9178163af0aecdba07a7ed/install.ps1 `
            -OutFile install-scoop.ps1
          ./install-scoop.ps1 -RunAsAdmin
      - name: Smoke official Scoop bucket
        if: matrix.channel == 'scoop'
        shell: pwsh
        run: |
          scoop bucket add jbcom https://github.com/jbcom/pkgs
          scoop install radioactive-ralph
          $version = $env:RELEASE_TAG.Substring(1)
          radioactive_ralph --version | Select-String -SimpleMatch $version
      - name: Smoke curl, deb, rpm, and available AppImage release paths
        if: startsWith(matrix.channel, 'linux-direct')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          TMP="$(mktemp -d)"
          sh docs/install.sh --version "$RELEASE_TAG" --install-dir "$TMP/bin"
          "$TMP/bin/radioactive_ralph" --version | grep -F "$VERSION"
          if [[ "$(uname -m)" == "aarch64" ]]; then
            ARCH=arm64
          else
            ARCH=amd64
          fi
          curl -fsSLo "$TMP/ralph.deb" \
            "$BASE/radioactive-ralph_${VERSION}_linux_${ARCH}.deb"
          sudo apt-get install -y "$TMP/ralph.deb"
          radioactive_ralph --version | grep -F "$VERSION"
          sudo dpkg -r radioactive-ralph
          curl -fsSLo "$TMP/ralph.rpm" \
            "$BASE/radioactive-ralph_${VERSION}_linux_${ARCH}.rpm"
          sudo apt-get update
          sudo apt-get install -y rpm
          sudo rpm --install "$TMP/ralph.rpm"
          radioactive_ralph --version | grep -F "$VERSION"
          if [[ "$ARCH" == amd64 ]]; then
            curl -fsSLo "$TMP/ralph.AppImage" \
              "$BASE/radioactive-ralph_${VERSION}_linux_x86_64.AppImage"
            chmod +x "$TMP/ralph.AppImage"
            APPIMAGE_EXTRACT_AND_RUN=1 "$TMP/ralph.AppImage" --version |
              grep -F "$VERSION"
          fi

  rollback-package-manifests:
    name: Compensate terminal immutable public-channel failure
    needs: [release-admission, publish-release, official-channel-smoke]
    if: always() && needs.publish-release.result == 'success' && needs.official-channel-smoke.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_CONTROL_REF }}
      - name: Fetch signed rollback provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release-admission.outputs.release_id }}
        run: |
          RELEASE_REPO="$GITHUB_REPOSITORY"
          release_gh() {
            gh "$@"
          }
          source scripts/ci/release_by_id.sh
          ralph_release_download_asset \
            "$RELEASE_TAG" "$RELEASE_SOURCE_COMMIT" published \
            package-rollback.tar.gz \
            "$RUNNER_TEMP/package-rollback.tar.gz"
      - name: Restore exact prior package manifests through protected main
        env:
          PKGS_GH_TOKEN: ${{ secrets.PKGS_GITHUB_TOKEN }}
        run: |
          bash scripts/ci/rollback_package_manifests.sh \
            "${RELEASE_TAG#v}" \
            "$RUNNER_TEMP/package-rollback.tar.gz" \
            "${{ needs.publish-release.outputs.package_release_merge_oid }}"
          {
            echo "## Immutable release v${RELEASE_TAG#v} is terminal"
            echo
            echo "An unavoidable post-publication network/channel check failed."
            echo "Package manifests were compensated. The immutable tag and release"
            echo "must not be reused; issue a new patch release."
          } >> "$GITHUB_STEP_SUMMARY"

  published-rerun-audit:
    name: Read-only immutable published rerun audit
    needs: release-admission
    if: needs.release-admission.outputs.state == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_CONTROL_REF }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify immutable bytes and historical package merge
        env:
          PKGS_GH_TOKEN: ${{ secrets.PKGS_GITHUB_TOKEN }}
          RELEASE_GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release-admission.outputs.release_id }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          bash scripts/ci/verify_release_assets.sh "$VERSION"
          release="$(GH_TOKEN="$RELEASE_GH_TOKEN" gh api \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          release_id="$(jq -er '.id' <<<"$release")"
          jq -e --argjson id "$RELEASE_ID" \
            --arg tag "$RELEASE_TAG" --arg target "$RELEASE_SOURCE_COMMIT" \
            '.id == $id and .draft == false and .prerelease == false and .immutable == true and
             .tag_name == $tag and .target_commitish == $target' \
            <<<"$release" >/dev/null
          PACKAGE_GATE_MODE=resolve-historical \
            GITHUB_OUTPUT="$RUNNER_TEMP/historical-package-output" \
            bash scripts/ci/wait_for_package_publication.sh "$VERSION"
          current_manifest="$(GH_TOKEN="$RELEASE_GH_TOKEN" gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/${GITHUB_REPOSITORY}/contents/.release-please-manifest.json?ref=main")"
          if [[ "$(jq -er '."."' <<<"$current_manifest")" == "$VERSION" ]]; then
            latest_id="$(GH_TOKEN="$RELEASE_GH_TOKEN" gh api --jq '.id' \
              "repos/${GITHUB_REPOSITORY}/releases/latest")"
            [[ "$latest_id" == "$release_id" ]]
          fi
