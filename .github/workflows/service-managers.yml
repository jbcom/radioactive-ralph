name: Service Managers

on:
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the REF, not a PR number: this workflow is workflow_dispatch-only,
# so github.event.pull_request.number is always empty and the run_id fallback
# would give every run a unique group — a concurrency block that can never
# cancel anything. Re-dispatching for the same ref supersedes the previous run.
#
# main is excluded from cancellation for the same reason as ci.yml: its runs
# can gate a release, and a unique group means nothing can cancel them.
concurrency:
  group: service-managers-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  launchd:
    name: launchd smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build CLI
        run: |
          mkdir -p .tmp
          go build -o .tmp/radioactive_ralph ./cmd/radioactive_ralph
      - name: launchd smoke
        run: bash scripts/ci/smoke_launchd.sh "$PWD/.tmp/radioactive_ralph" "${{ matrix.arch }}"

  systemd-user:
    name: systemd-user smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build CLI
        run: |
          mkdir -p .tmp
          go build -o .tmp/radioactive_ralph ./cmd/radioactive_ralph
      - name: systemd-user smoke
        run: bash scripts/ci/smoke_systemd_user.sh "$PWD/.tmp/radioactive_ralph"

  windows-scm:
    name: windows scm fail-closed safety smoke
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .tmp | Out-Null
          go build -o .\.tmp\radioactive_ralph.exe ./cmd/radioactive_ralph
      - name: windows scm fail-closed safety smoke
        shell: pwsh
        run: .\scripts\ci\smoke_windows_scm.ps1 -Bin "$PWD\.tmp\radioactive_ralph.exe"
