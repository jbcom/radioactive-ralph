version: 2
updates:
  # Keep both supported dependency surfaces current: the Go binary and the
  # Sourcey documentation site.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      major:
        patterns: ["*"]
        update-types: ["major"]
      non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      major:
        patterns: ["*"]
        update-types: ["major"]
      non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      major:
        patterns: ["*"]
        update-types: ["major"]
      non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]
