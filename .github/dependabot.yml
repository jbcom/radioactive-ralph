version: 2
updates:
  # The supported runtime is the repo-root Go module. The retained site/ and
  # reference/ sources are intentionally non-installable historical archives.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
